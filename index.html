<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3D Animated Background</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="showcase" aria-label="3D animated background demo">
      <div class="background-scene" aria-hidden="true">
        <span class="background-layer layer-far"></span>
        <span class="background-layer layer-mid"></span>
        <span class="background-layer layer-near"></span>
        <span class="background-glow"></span>
        <span class="background-sheen"></span>
      </div>

      <section class="content-card">
        <p class="eyebrow">3D background test</p>
        <h1>Depth without an image block.</h1>
        <p>
          The uploaded file is used only as an animated page background now — no
          foreground image render, no visible image card, just a moving 3D backdrop.
        </p>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
